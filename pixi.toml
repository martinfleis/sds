[workspace]
authors = ["Martin Fleischmann <martin@martinfleischmann.net>"]
channels = ["conda-forge"]
description = "A course on spatial data science in Python"
name = "sds"
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tasks]

[dependencies]
python = ">=3.14.7,<3.15"
astropy = ">=8.0.1,<9"
contextily = ">=1.7.1,<2"
datashader = ">=0.19.1,<0.20"
esda = ">=2.10.0,<3"
geocube = ">=0.7.1,<0.8"
geopandas = ">=1.1.4,<2"
geopy = ">=2.5.0,<3"
gwlearn = ">=0.2.0,<0.3"
h3-py = ">=4.5.0,<5"
httpx = ">=0.28.1,<0.29"
libpysal = ">=4.15.0,<5"
mgwr = ">=2.2.1,<3"
openpyxl = ">=3.1.5,<4"
osmnx = ">=2.1.1,<3"
pandas = ">=3.0.5,<4"
pointpats = ">=2.6.0,<3"
pyarrow = ">=25.0.0,<26"
pyinterpolate = ">=1.2.1,<2"
pyogrio = ">=0.13.0,<0.14"
rioxarray = ">=0.23.0,<0.24"
rasterio = ">=1.5.1,<2"
scikit-learn = ">=1.9.1,<2"
seaborn = ">=0.13.2,<0.14"
spglm = ">=1.1.0,<2"
spreg = ">=1.9.1,<2"
statsmodels = ">=0.15.0,<0.16"
tobler = ">=0.14.0,<0.15"
xarray = ">=2026.7.0,<2027"
xvec = ">=0.5.2,<0.6"
dask-expr = ">=2.0.0,<3"
ipykernel = ">=7.3.0,<8"
jupyter-cache = ">=1.0.1,<2"
jupyterlab = ">=4.6.3,<5"
pip = ">=26.2.1,<27"

[pypi-dependencies]
kdepy = ">=1.1.12, <2"
